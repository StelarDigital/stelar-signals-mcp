name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Show versions
        run: node -v && npm -v

      # No NODE_AUTH_TOKEN: auth comes from the OIDC id-token above.
      - name: Publish
        run: npm publish --access public
